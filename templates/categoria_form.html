{% extends "base.html" %}

{% block titulo %}{{ titulo }}{% endblock %}

{% block conteudo %}
  <section class="painel painel-formulario" aria-labelledby="titulo-formulario">
    <h1 id="titulo-formulario">{{ titulo }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ token_formulario() }}">
      <div class="campo">
        <label for="nome">Nome da categoria</label>
        <input type="text" id="nome" name="nome" value="{{ nome }}" maxlength="60" required>
      </div>
      <div class="botoes">
        <button class="botao" type="submit">Salvar</button>
        <a class="botao discreto" href="{{ url_for('categorias') }}">Cancelar</a>
      </div>
    </form>
  </section>
{% endblock %}
