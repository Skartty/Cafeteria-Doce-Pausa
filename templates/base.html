<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{% endblock %} | Doce Pausa</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="barra">
    <div class="barra-conteudo">
      <a class="marca" href="{{ url_for('inicio' if session.usuario_id else 'login') }}">Doce Pausa</a>
      {% if session.usuario_id %}
        <nav aria-label="Navegação principal">
          <a href="{{ url_for('inicio') }}"{% if request.endpoint == 'inicio' %} aria-current="page"{% endif %}>Cardápio</a>
          <a href="{{ url_for('categorias') }}"{% if request.endpoint == 'categorias' %} aria-current="page"{% endif %}>Categorias</a>
        </nav>
        <form class="sessao" method="post" action="{{ url_for('logout') }}">
          <span>{{ session.nome }}</span>
          <input type="hidden" name="csrf_token" value="{{ token_formulario() }}">
          <button class="botao discreto" type="submit">Sair</button>
        </form>
      {% endif %}
    </div>
  </header>

  <main class="conteudo">
    {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
      <div class="flash {{ categoria }}" role="{{ 'alert' if categoria == 'erro' else 'status' }}">{{ mensagem }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
